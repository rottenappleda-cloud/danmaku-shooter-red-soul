
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>幻想紅月夜 Ver.4.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080817;color:white;font-family:sans-serif;overflow:hidden;touch-action:none}
canvas{width:100vw;height:100dvh;display:block;touch-action:none}
#hud{position:fixed;top:8px;left:10px;z-index:2;pointer-events:none;text-shadow:0 1px 5px black;font-size:13px;line-height:1.7}
#bossbar{position:fixed;top:125px;left:8%;width:84%;height:10px;background:#333;border:1px solid #aaa;display:none;z-index:2}
#bossfill{height:100%;width:100%;background:#55caff}
#spellText{position:fixed;top:34%;left:0;width:100%;text-align:center;color:#c5f2ff;font-size:27px;font-weight:bold;text-shadow:0 0 15px #27aaff;z-index:4;pointer-events:none;display:none}
#overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:linear-gradient(#080817ed,#18102aee);padding:18px;overflow:auto}
h1{font-size:clamp(30px,8vw,48px);color:#b8eaff;text-shadow:0 0 20px #168bdc}
h2{color:#d4f3ff}
p{line-height:1.6}
button{background:#174c78;color:white;border:1px solid #8bdcff;border-radius:10px;padding:12px 20px;font-size:16px;margin:5px;min-width:110px;cursor:pointer}
button:active{background:#287db8}
button.selected{background:#2586bd;border:2px solid white}
#choices,#difficulties{display:flex;flex-wrap:wrap;justify-content:center}
#stick{position:fixed;left:22px;bottom:28px;width:116px;height:116px;border:2px solid #ffffff66;border-radius:50%;background:#ffffff15;z-index:3;touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:42px;height:42px;border-radius:50%;background:#c8eaffbb;border:2px solid white}
#dash{position:fixed;right:28px;bottom:190px;width:70px;height:48px;min-width:0;padding:5px;background:#167c9ddd;z-index:3}
#bomb{position:fixed;right:22px;bottom:110px;width:78px;height:65px;min-width:0;padding:5px;background:#245e9cdd;border:2px solid white;z-index:3}
#spellButton{position:fixed;right:22px;bottom:30px;width:90px;height:65px;min-width:0;padding:5px;background:#6841a8dd;border:2px solid #d9c2ff;z-index:3}
.small{font-size:12px;color:#cbd9eb}
.hidden{display:none!important}
button:disabled{opacity:.4}
</style>
</head>
<body>

<div id="hud">
 <div>幻想紅月夜 Ver.4.0</div>
 <div>PLAYER : ディフェンダー</div>
 <div id="score">SCORE : 0</div>
 <div id="life">LIFE : 3</div>
 <div id="bombs">BOMB : 3</div>
 <div id="soul">SOUL : 0 / 10</div>
 <div id="stage">STAGE : 1</div>
 <div id="cooldown">BOMB : READY</div>
</div>

<div id="bossbar"><div id="bossfill"></div></div>
<div id="spellText"></div>
<canvas id="game"></canvas>

<div id="stick"><div id="knob"></div></div>
<button id="dash">DASH<br><small>X</small></button>
<button id="bomb">BOMB<br><small id="bombCount">3</small></button>
<button id="spellButton">SPELL<br><small id="spellCount">0 / 10</small></button>

<div id="overlay">
 <h1>幻想紅月夜</h1>
 <h2>紅月弾幕録 Ver.4.0</h2>
 <p>氷の守護者、出撃。</p>

 <div id="menu">
  <button id="newGame">GAME START</button>
  <button id="instructions">HOW TO PLAY</button>
  <p id="highscore" class="small"></p>
 </div>

 <div id="select" class="hidden">
  <h2>自機選択</h2>
  <div id="choices">
   <button class="selected">❄ ディフェンダー</button>
  </div>
  <p>落ち着いた性格。氷を扱う守護者。</p>
  <h2>難易度</h2>
  <div id="difficulties">
   <button class="selected" data-diff="0">EASY</button>
   <button data-diff="1">NORMAL</button>
   <button data-diff="2">HARD</button>
  </div>
  <button id="begin">出撃する！</button>
  <button id="back">戻る</button>
 </div>

 <div id="help" class="hidden">
  <h2>操作方法</h2>
  <p>WASD・矢印：移動</p>
  <p>SHIFT：低速移動</p>
  <p>X：ダッシュ</p>
  <p>C：ボム（敵弾を消す・10秒クールダウン）</p>
  <p>Z：スペルカード（ソウル10個必要）</p>
  <p>ESC：ポーズ</p>
  <p>iPad：左下の操作盤と右下のボタン</p>
  <button id="helpBack">戻る</button>
 </div>

 <div id="pauseMenu" class="hidden">
  <h2>PAUSE</h2>
  <button id="resume">ゲームに戻る</button>
  <button id="quit">タイトルに戻る</button>
 </div>

 <div id="result" class="hidden">
  <h2 id="resultTitle">GAME OVER</h2>
  <p id="resultText"></p>
  <button id="retry">もう一度遊ぶ</button>
  <button id="titleButton">タイトルへ</button>
 </div>
</div>

<script>
"use strict";

// ===================================
// 画面とキャンバス
// ===================================

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth,H=innerHeight;
let DPR=1;

function resize(){
 W=innerWidth;
 H=innerHeight;
 DPR=Math.min(devicePixelRatio||1,2);
 canvas.width=W*DPR;
 canvas.height=H*DPR;
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);
resize();

// ===================================
// 自機画像
// defender.png を同じ場所に置く
// ===================================

const defenderImage=new Image();
defenderImage.src="defender.png";

let spriteCanvas=document.createElement("canvas");
let spriteReady=false;

defenderImage.onload=function(){
 const sw=defenderImage.width;
 const sh=defenderImage.height;

 if(sw<=0||sh<=0)return;

 spriteCanvas.width=sw;
 spriteCanvas.height=sh;

 const sctx=spriteCanvas.getContext("2d",{willReadFrequently:true});
 sctx.drawImage(defenderImage,0,0);

 // 白背景を透明化
 const imageData=sctx.getImageData(0,0,sw,sh);
 const data=imageData.data;

 for(let i=0;i<data.length;i+=4){
  if(data[i]>235&&data[i+1]>235&&data[i+2]>235){
   data[i+3]=0;
  }
 }

 sctx.putImageData(imageData,0,0);
 spriteReady=true;
};

defenderImage.onerror=function(){
 console.log("defender.pngを読み込めませんでした。");
};

// ===================================
// UI
// ===================================

const overlay=document.getElementById("overlay");
const menu=document.getElementById("menu");
const select=document.getElementById("select");
const help=document.getElementById("help");
const pauseMenu=document.getElementById("pauseMenu");
const result=document.getElementById("result");

const bossbar=document.getElementById("bossbar");
const bossfill=document.getElementById("bossfill");
const spellText=document.getElementById("spellText");

function showPanel(panel){
 menu.classList.add("hidden");
 select.classList.add("hidden");
 help.classList.add("hidden");
 pauseMenu.classList.add("hidden");
 result.classList.add("hidden");
 panel.classList.remove("hidden");
 overlay.classList.remove("hidden");
}

function showTitle(){
 showPanel(menu);
 document.querySelector("#menu h2").textContent="紅月弾幕録 Ver.4.0";
 document.querySelector("#menu p").textContent="氷の守護者、出撃。";
}

let difficulty=0;
let highscore=Number(localStorage.getItem("defenderHighscore")||0);
document.getElementById("highscore").textContent="HIGH SCORE : "+highscore;

document.getElementById("newGame").addEventListener("click",()=>showPanel(select));
document.getElementById("instructions").addEventListener("click",()=>showPanel(help));
document.getElementById("helpBack").addEventListener("click",showTitle);
document.getElementById("back").addEventListener("click",showTitle);

document.querySelectorAll("[data-diff]").forEach(button=>{
 button.addEventListener("click",()=>{
  difficulty=Number(button.dataset.diff);
  document.querySelectorAll("[data-diff]").forEach(b=>b.classList.remove("selected"));
  button.classList.add("selected");
 });
});

// ===================================
// ゲームデータ
// ===================================

let running=false;
let paused=false;
let frame=0;
let score=0;
let stage=1;
let lives=3;
let bombs=3;
let souls=0;

let enemies=[];
let bullets=[];
let enemyBullets=[];
let particles=[];
let soulDrops=[];
let spellBalls=[];
let shockwaves=[];
let boss=null;

let spawnTimer=0;
let stageMessage=0;
let bombCooldown=0;
let spellInvincible=0;
let spellTextTimer=0;

const player={
 x:0,y:0,
 vx:0,vy:0,
 lastX:0,lastY:-1,
 speed:3.6,
 radius:4,
 invincible:0,
 dashCooldown:0,
 dashTime:0,
 shotTimer:0
};

const keys={};
let joy={x:0,y:0};
let joyActive=false;

// ===================================
// キーボード
// ===================================

addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();

 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)){
  e.preventDefault();
 }

 if(!keys[k]){
  if(k==="x")useDash();
  if(k==="c")useBomb();
  if(k==="z")useSpell();
  if(k==="escape")togglePause();
 }

 keys[k]=true;
});

addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

// ===================================
// タッチ操作
// ===================================

const stick=document.getElementById("stick");
const knob=document.getElementById("knob");

function updateJoy(e){
 const r=stick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 const max=39;
 const len=Math.hypot(dx,dy);

 if(len>max){
  dx=dx/len*max;
  dy=dy/len*max;
 }

 joy.x=dx/max;
 joy.y=dy/max;
 knob.style.left=(35+dx)+"px";
 knob.style.top=(35+dy)+"px";
}

stick.addEventListener("pointerdown",e=>{
 joyActive=true;
 stick.setPointerCapture(e.pointerId);
 updateJoy(e);
});

stick.addEventListener("pointermove",e=>{
 if(joyActive)updateJoy(e);
});

function stopJoy(){
 joyActive=false;
 joy={x:0,y:0};
 knob.style.left="35px";
 knob.style.top="35px";
}

stick.addEventListener("pointerup",stopJoy);
stick.addEventListener("pointercancel",stopJoy);

document.getElementById("dash").addEventListener("pointerdown",e=>{
 e.preventDefault();
 useDash();
});

document.getElementById("bomb").addEventListener("pointerdown",e=>{
 e.preventDefault();
 useBomb();
});

document.getElementById("spellButton").addEventListener("pointerdown",e=>{
 e.preventDefault();
 useSpell();
});

function getInput(){
 let x=joy.x;
 let y=joy.y;

 if(keys["arrowleft"]||keys["a"])x-=1;
 if(keys["arrowright"]||keys["d"])x+=1;
 if(keys["arrowup"]||keys["w"])y-=1;
 if(keys["arrowdown"]||keys["s"])y+=1;

 const len=Math.hypot(x,y);
 if(len>1){x/=len;y/=len;}

 return {x,y};
}

// ===================================
// ゲーム開始
// ===================================

document.getElementById("begin").addEventListener("click",startGame);

function startGame(){
 enemies=[];
 bullets=[];
 enemyBullets=[];
 particles=[];
 soulDrops=[];
 spellBalls=[];
 shockwaves=[];
 boss=null;

 score=0;
 stage=1;
 lives=3;
 bombs=3;
 souls=0;
 frame=0;
 spawnTimer=0;
 stageMessage=160;
 paused=false;
 running=true;

 bombCooldown=0;
 spellInvincible=0;
 spellTextTimer=0;

 player.x=W/2;
 player.y=H*.78;
 player.lastX=0;
 player.lastY=-1;
 player.vx=0;
 player.vy=0;
 player.invincible=120;
 player.dashCooldown=0;
 player.dashTime=0;
 player.shotTimer=0;

 bossbar.style.display="none";
 spellText.style.display="none";

 overlay.classList.add("hidden");
 updateHUD();
}

// ===================================
// ダッシュ
// ===================================

function useDash(){
 if(!running||paused||player.dashCooldown>0)return;

 let dx=player.lastX;
 let dy=player.lastY;

 if(Math.hypot(dx,dy)<.1)dy=-1;

 const len=Math.hypot(dx,dy);
 dx/=len;
 dy/=len;

 player.vx=dx*13;
 player.vy=dy*13;
 player.dashTime=13;
 player.dashCooldown=100;
 player.invincible=Math.max(player.invincible,25);

 for(let i=0;i<15;i++){
  particles.push({
   x:player.x,y:player.y,
   vx:(Math.random()-.5)*4,
   vy:(Math.random()-.5)*4,
   life:25,color:"#8eeaff"
  });
 }
}

// ===================================
// ボム
// 敵弾だけを消す。敵にはダメージなし。
// クールダウンは10秒。
// ===================================

function useBomb(){
 if(!running||paused||bombs<=0||bombCooldown>0)return;

 bombs--;
 bombCooldown=600;

 enemyBullets=[];

 for(let i=0;i<45;i++){
  const a=Math.random()*Math.PI*2;
  const s=Math.random()*5+1;
  particles.push({
   x:player.x,y:player.y,
   vx:Math.cos(a)*s,
   vy:Math.sin(a)*s,
   life:30,color:"#8bdfff"
  });
 }

 updateHUD();
}

// ===================================
// スペルカード
// ===================================

function useSpell(){
 if(!running||paused||souls<10)return;

 souls-=10;

 // 10秒間、敵弾から無敵
 spellInvincible=600;
 player.invincible=Math.max(player.invincible,600);

 // 発動文字
 spellText.textContent="本能解放";
 spellText.style.display="block";
 spellTextTimer=110;

 // 波紋レーザー
 shockwaves.push({
  x:player.x,
  y:player.y,
  radius:10,
  maxRadius:Math.max(W,H)*1.2,
  speed:2.1,
  hitEnemies:[]
 });

 // 大きな電気球を3発
 for(let i=-1;i<=1;i++){
  spellBalls.push({
   x:player.x+i*24,
   y:player.y-30,
   vx:i*.45,
   vy:-2.1,
   radius:24,
   damage:12,
   life:260,
   phase:Math.random()*10
  });
 }

 for(let i=0;i<30;i++){
  const a=Math.random()*Math.PI*2;
  particles.push({
   x:player.x,y:player.y,
   vx:Math.cos(a)*4,
   vy:Math.sin(a)*4,
   life:35,color:"#b8eaff"
  });
 }

 updateHUD();
}

// ===================================
// ショットと敵弾
// ===================================

function shoot(){
 bullets.push({
  x:player.x-12,y:player.y-20,
  vx:0,vy:-10,r:6,damage:1
 });
 bullets.push({
  x:player.x+12,y:player.y-20,
  vx:0,vy:-10,r:6,damage:1
 });
}

function spawnEnemy(){
 const x=30+Math.random()*(W-60);
 enemies.push({
  x,y:-25,hp:3,
  vx:(Math.random()-.5)*1.5,
  vy:1.2+Math.random(),
  timer:0
 });
}

function spawnEnemyBullet(x,y,vx,vy,color="#ff6688",r=5){
 enemyBullets.push({x,y,vx,vy,r,color});
}

function aimedBullet(x,y,speed,offset=0){
 const a=Math.atan2(player.y-y,player.x-x)+offset;
 spawnEnemyBullet(x,y,Math.cos(a)*speed,Math.sin(a)*speed);
}

function circlePattern(x,y,count,speed,offset,color){
 for(let i=0;i<count;i++){
  const a=(Math.PI*2/count)*i+offset;
  spawnEnemyBullet(x,y,Math.cos(a)*speed,Math.sin(a)*speed,color,5);
 }
}

// ===================================
// ソウルドロップ
// ===================================

function dropSoul(x,y){
 soulDrops.push({
  x,y,
  vx:(Math.random()-.5)*1.4,
  vy:1.1,
  phase:Math.random()*6,
  life:900
 });
}

function updateSoulDrops(){
 for(const s of soulDrops){
  s.x+=s.vx+Math.sin(frame*.04+s.phase)*.45;
  s.y+=s.vy;
  s.vx*=.99;
  s.life--;

  // 自機に近づくと回収
  if(Math.hypot(s.x-player.x,s.y-player.y)<23){
   if(souls<10){
    souls++;
    score+=50;
   }
   s.dead=true;
  }
 }

 soulDrops=soulDrops.filter(s=>!s.dead&&s.life>0&&s.y<H+30);
}

// ===================================
// ボス
// ===================================

function createBoss(){
 boss={
  x:W/2,y:105,
  hp:stage===1?180:260,
  maxHp:stage===1?180:260,
  timer:0
 };

 bossbar.style.display="block";
 spellText.style.display="block";
 spellText.textContent=stage===1?
  "氷符「凍てつく守護壁」":
  "絶対零度「蒼氷の世界」";
}

function bossAttack(){
 if(!boss)return;

 const t=boss.timer;
 const speed=difficulty===0?1.7:difficulty===1?2.3:2.9;

 if(stage===1){
  if(t%65===0){
   circlePattern(boss.x,boss.y+20,14,speed,t*.025,"#72dfff");
  }
  if(t%32===0){
   aimedBullet(boss.x,boss.y+20,speed+1);
  }
 }else{
  if(t%45===0){
   circlePattern(boss.x,boss.y+20,20,speed,t*.04,"#7aafff");
  }
  if(t%22===0){
   aimedBullet(boss.x-25,boss.y+15,speed+1,-.16);
   aimedBullet(boss.x+25,boss.y+15,speed+1,.16);
  }
 }
}

// ===================================
// ステージ進行
// ===================================

function nextStage(){
 stage++;

 boss=null;
 enemies=[];
 enemyBullets=[];
 bullets=[];
 spellBalls=[];
 shockwaves=[];

 bossbar.style.display="none";
 spellText.style.display="none";

 player.invincible=150;
 player.x=W/2;
 player.y=H*.78;

 frame=0;
 spawnTimer=0;
 stageMessage=180;

 if(stage>2)clearGame();
}

function clearGame(){
 running=false;
 bossbar.style.display="none";
 spellText.style.display="none";

 if(score>highscore){
  highscore=score;
  localStorage.setItem("defenderHighscore",String(highscore));
 }

 document.getElementById("highscore").textContent="HIGH SCORE : "+highscore;
 document.getElementById("resultTitle").textContent="ALL STAGE CLEAR!";
 document.getElementById("resultText").textContent="SCORE : "+score;

 showPanel(result);
}

// ===================================
// 衝突判定
// ===================================

function hit(a,b,r){
 return Math.hypot(a.x-b.x,a.y-b.y)<r;
}

function damagePlayer(){
 if(player.invincible>0||spellInvincible>0)return;

 lives--;
 player.invincible=110;
 updateHUD();

 if(lives<=0)endGame();
}

// ===================================
// ゲーム終了
// ===================================

function endGame(){
 running=false;
 bossbar.style.display="none";
 spellText.style.display="none";

 if(score>highscore){
  highscore=score;
  localStorage.setItem("defenderHighscore",String(highscore));
 }

 document.getElementById("highscore").textContent="HIGH SCORE : "+highscore;
 document.getElementById("resultTitle").textContent="GAME OVER";
 document.getElementById("resultText").textContent="SCORE : "+score;

 showPanel(result);
}

document.getElementById("retry").addEventListener("click",startGame);

document.getElementById("titleButton").addEventListener("click",()=>{
 running=false;
 paused=false;
 showTitle();
});

// ===================================
// ポーズ
// ===================================

function togglePause(){
 if(!running)return;

 paused=!paused;

 if(paused){
  showPanel(pauseMenu);
 }else{
  overlay.classList.add("hidden");
 }
}

document.getElementById("resume").addEventListener("click",()=>{
 paused=false;
 overlay.classList.add("hidden");
});

document.getElementById("quit").addEventListener("click",()=>{
 running=false;
 paused=false;
 showTitle();
});

// ===================================
// HUD
// ===================================

function updateHUD(){
 document.getElementById("score").textContent="SCORE : "+score;
 document.getElementById("life").textContent="LIFE : "+lives;
 document.getElementById("bombs").textContent="BOMB : "+bombs;
 document.getElementById("bombCount").textContent=bombs;
 document.getElementById("soul").textContent="SOUL : "+souls+" / 10";
 document.getElementById("spellCount").textContent=souls+" / 10";
 document.getElementById("stage").textContent="STAGE : "+stage;

 document.getElementById("cooldown").textContent=
  bombCooldown>0?
  "BOMB : "+(bombCooldown/60).toFixed(1)+"秒":
  "BOMB : READY";

 document.getElementById("spellButton").disabled=souls<10;
}

// ===================================
// 更新処理
// ===================================

function update(){
 if(!running||paused)return;

 frame++;

 if(bombCooldown>0)bombCooldown--;
 if(spellInvincible>0)spellInvincible--;
 if(spellTextTimer>0){
  spellTextTimer--;
  if(spellTextTimer===0)spellText.style.display="none";
 }

 const input=getInput();
 const slow=keys["shift"];
 const speed=slow?1.8:player.speed;

 if(player.dashTime>0){
  player.x+=player.vx;
  player.y+=player.vy;
  player.dashTime--;
  player.vx*=.88;
  player.vy*=.88;
 }else{
  player.x+=input.x*speed;
  player.y+=input.y*speed;

  if(input.x||input.y){
   player.lastX=input.x;
   player.lastY=input.y;
  }
 }

 player.x=Math.max(15,Math.min(W-15,player.x));
 player.y=Math.max(35,Math.min(H-25,player.y));

 if(player.invincible>0)player.invincible--;
 if(player.dashCooldown>0)player.dashCooldown--;

 player.shotTimer++;
 if(player.shotTimer%9===0)shoot();

 // 敵出現
 spawnTimer++;
 const spawnLimit=difficulty===0?70:difficulty===1?55:42;

 if(!boss&&spawnTimer>spawnLimit){
  spawnEnemy();
  spawnTimer=0;
 }

 // 敵の動き
 for(const e of enemies){
  e.x+=e.vx;
  e.y+=e.vy;
  e.timer++;

  if(e.timer%85===0)aimedBullet(e.x,e.y,2.3);
 }

 // ボス登場
 if(frame>1250&&!boss)createBoss();

 // ボス攻撃
 if(boss){
  boss.timer++;
  boss.x=W/2+Math.sin(boss.timer*.012)*W*.27;
  bossAttack();
  bossfill.style.width=Math.max(0,boss.hp/boss.maxHp*100)+"%";

  if(boss.hp<=0){
   score+=stage===1?5000:10000;

   for(let i=0;i<50;i++){
    particles.push({
     x:boss.x,y:boss.y,
     vx:(Math.random()-.5)*8,
     vy:(Math.random()-.5)*8,
     life:40,color:"#8ceaff"
    });
   }

   nextStage();
  }
 }

 // 通常ショット
 for(const b of bullets){
  b.x+=b.vx;
  b.y+=b.vy;

  for(const e of enemies){
   if(!b.dead&&hit(b,e,17)){
    e.hp-=b.damage;
    b.dead=true;
    score+=10;
    break;
   }
  }

  if(!b.dead&&boss&&hit(b,boss,45)){
   boss.hp-=b.damage;
   b.dead=true;
  }
 }

 bullets=bullets.filter(b=>!b.dead&&b.y>-20);

 // スペルカードの電気球
 for(const b of spellBalls){
  b.x+=b.vx+Math.sin(frame*.04+b.phase)*.25;
  b.y+=b.vy;
  b.life--;

  // 雑魚敵に当たった場合
  for(const e of enemies){
   if(!b.dead&&hit(b,e,b.radius+14)){
    e.hp-=b.damage;
    b.dead=true;
    break;
   }
  }

  // ボスにもダメージ
  if(!b.dead&&boss&&hit(b,boss,b.radius+37)){
   boss.hp-=b.damage;
   b.dead=true;
  }

  if(b.life<=0||b.y<-60)b.dead=true;
 }

 spellBalls=spellBalls.filter(b=>!b.dead);

 // 波紋レーザー
 for(const wave of shockwaves){
  const oldRadius=wave.radius;
  wave.radius+=wave.speed;

  for(const e of enemies){
   if(wave.hitEnemies.includes(e))continue;

   const d=Math.hypot(e.x-wave.x,e.y-wave.y);

   if(d>=oldRadius-18&&d<=wave.radius+18){
    e.hp=0;
    wave.hitEnemies.push(e);
   }
  }
 }

 shockwaves=shockwaves.filter(w=>w.radius<w.maxRadius);

 // 敵弾
 for(const b of enemyBullets){
  b.x+=b.vx;
  b.y+=b.vy;

  if(hit(b,player,b.r+player.radius)&&player.invincible<=0&&spellInvincible<=0){
   damagePlayer();
   b.dead=true;
  }
 }

 enemyBullets=enemyBullets.filter(b=>
  !b.dead&&b.x>-30&&b.x<W+30&&b.y>-30&&b.y<H+30
 );

 // 敵との接触
 for(const e of enemies){
  if(hit(e,player,17)&&player.invincible<=0&&spellInvincible<=0){
   damagePlayer();
  }
 }

 if(boss&&hit(boss,player,42)&&player.invincible<=0&&spellInvincible<=0){
  damagePlayer();
 }

 // 雑魚敵撃破とソウル出現
 for(const e of enemies){
  if(e.hp<=0&&!e.rewarded){
   e.rewarded=true;
   score+=100;
   dropSoul(e.x,e.y);
  }
 }

 enemies=enemies.filter(e=>e.hp>0&&e.y<H+50);

 // ソウル回収
 updateSoulDrops();

 // パーティクル
 for(const p of particles){
  p.x+=p.vx;
  p.y+=p.vy;
  p.vx*=.96;
  p.vy*=.96;
  p.life--;
 }

 particles=particles.filter(p=>p.life>0);

 if(stageMessage>0)stageMessage--;

 updateHUD();
}

// ===================================
// 描画
// ===================================

function drawBackground(){
 ctx.fillStyle="#080817";
 ctx.fillRect(0,0,W,H);

 for(let i=0;i<65;i++){
  const x=(i*137)%W;
  const y=(i*89+frame*.7)%H;
  ctx.fillStyle=i%3===0?"#7caedb":"#ffffff55";
  ctx.fillRect(x,y,2,2);
 }

 ctx.beginPath();
 ctx.arc(W*.78,H*.18,35,0,Math.PI*2);
 ctx.fillStyle="#a9dfff22";
 ctx.fill();

 ctx.beginPath();
 ctx.arc(W*.78,H*.18,25,0,Math.PI*2);
 ctx.fillStyle="#bdeaff22";
 ctx.fill();
}

function drawPlayer(){
 ctx.save();

 if((player.invincible>0||spellInvincible>0)&&Math.floor(frame/5)%2===0){
  ctx.globalAlpha=.5;
 }

 if(spriteReady){
  const sw=spriteCanvas.width;
  const sh=spriteCanvas.height;
  const scale=Math.min(58/sw,108/sh);
  const drawW=sw*scale;
  const drawH=sh*scale;

  ctx.drawImage(
   spriteCanvas,0,0,sw,sh,
   player.x-drawW/2,
   player.y-drawH/2,
   drawW,drawH
  );
 }else{
  ctx.fillStyle="#222";
  ctx.fillRect(player.x-12,player.y-18,24,36);
  ctx.fillStyle="#59d9ff";
  ctx.fillRect(player.x-7,player.y-12,14,24);
 }

 ctx.restore();

 // 当たり判定の中心
 ctx.beginPath();
 ctx.arc(player.x,player.y,player.radius,0,Math.PI*2);
 ctx.fillStyle="#ffffff";
 ctx.fill();

 if(keys["shift"]){
  ctx.beginPath();
  ctx.arc(player.x,player.y,10,0,Math.PI*2);
  ctx.strokeStyle="#b7efff";
  ctx.stroke();
 }

 if(spellInvincible>0){
  ctx.beginPath();
  ctx.arc(player.x,player.y,35,0,Math.PI*2);
  ctx.strokeStyle="#b8eaff99";
  ctx.lineWidth=3;
  ctx.stroke();
 }
}

// 菱形の通常弾
function drawBullets(){
 for(const b of bullets){
  ctx.save();
  ctx.translate(b.x,b.y);
  ctx.rotate(Math.PI/4);
  ctx.fillStyle="#a8eeff";
  ctx.shadowColor="#66dfff";
  ctx.shadowBlur=8;
  ctx.fillRect(-4,-4,8,8);
  ctx.restore();
 }

 for(const b of enemyBullets){
  ctx.fillStyle=b.color;
  ctx.beginPath();
  ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle="#ffffff66";
  ctx.stroke();
 }
}

// 電気を帯びた大きな球
function drawSpellBalls(){
 for(const b of spellBalls){
  ctx.save();

  ctx.shadowColor="#5eeaff";
  ctx.shadowBlur=25;

  const gradient=ctx.createRadialGradient(
   b.x-b.radius*.25,b.y-b.radius*.25,2,
   b.x,b.y,b.radius
  );

  gradient.addColorStop(0,"#ffffff");
  gradient.addColorStop(.3,"#c9faff");
  gradient.addColorStop(.7,"#38bfff");
  gradient.addColorStop(1,"#1762c9");

  ctx.fillStyle=gradient;
  ctx.beginPath();
  ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#eaffff";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.arc(b.x,b.y,b.radius+3,0,Math.PI*2);
  ctx.stroke();

  // 電気のきらめき
  for(let i=0;i<4;i++){
   const a=frame*.12+i*Math.PI/2+b.phase;
   ctx.strokeStyle="#dfffff";
   ctx.lineWidth=2;
   ctx.beginPath();
   ctx.moveTo(b.x+Math.cos(a)*b.radius*.7,b.y+Math.sin(a)*b.radius*.7);
   ctx.lineTo(b.x+Math.cos(a+.4)*(b.radius+10),b.y+Math.sin(a+.4)*(b.radius+10));
   ctx.stroke();
  }

  ctx.restore();
 }
}

// 波紋レーザー
function drawShockwaves(){
 for(const w of shockwaves){
  ctx.save();

  ctx.beginPath();
  ctx.arc(w.x,w.y,w.radius,0,Math.PI*2);
  ctx.strokeStyle="#a9f4ff";
  ctx.lineWidth=9;
  ctx.shadowColor="#48dfff";
  ctx.shadowBlur=25;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(w.x,w.y,w.radius,0,Math.PI*2);
  ctx.strokeStyle="#ffffff";
  ctx.lineWidth=2;
  ctx.stroke();

  ctx.restore();
 }
}

// ソウル
function drawSouls(){
 for(const s of soulDrops){
  ctx.save();
  ctx.translate(s.x,s.y);
  ctx.rotate(frame*.04+s.phase);

  ctx.shadowColor="#d8aaff";
  ctx.shadowBlur=15;
  ctx.fillStyle="#d9b5ff";

  ctx.beginPath();
  ctx.moveTo(0,-9);
  ctx.lineTo(7,0);
  ctx.lineTo(0,9);
  ctx.lineTo(-7,0);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle="#ffffff";
  ctx.lineWidth=1.5;
  ctx.stroke();

  ctx.restore();
 }
}

function drawEnemies(){
 for(const e of enemies){
  ctx.fillStyle="#a94b76";
  ctx.beginPath();
  ctx.arc(e.x,e.y,14,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#ffd5e5";
  ctx.fillRect(e.x-5,e.y-3,10,5);
 }
}

function drawBoss(){
 if(!boss)return;

 ctx.save();
 ctx.fillStyle="#173d63";
 ctx.strokeStyle="#8eeaff";
 ctx.lineWidth=3;

 ctx.beginPath();
 ctx.arc(boss.x,boss.y,37,0,Math.PI*2);
 ctx.fill();
 ctx.stroke();

 ctx.fillStyle="#d9f7ff";
 ctx.beginPath();
 ctx.arc(boss.x,boss.y,12,0,Math.PI*2);
 ctx.fill();

 ctx.restore();
}

function drawParticles(){
 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life/40);
  ctx.fillStyle=p.color;
  ctx.beginPath();
  ctx.arc(p.x,p.y,3,0,Math.PI*2);
  ctx.fill();
 }
 ctx.globalAlpha=1;
}

function drawStageMessage(){
 if(stageMessage<=0)return;

 ctx.save();
 ctx.textAlign="center";
 ctx.fillStyle="#d4f3ff";
 ctx.font="bold 28px sans-serif";
 ctx.shadowColor="#168bdc";
 ctx.shadowBlur=15;

 ctx.fillText("STAGE "+stage,W/2,H*.42);

 ctx.font="16px sans-serif";
 ctx.fillText(stage===1?"氷の守護者":"蒼氷の世界",W/2,H*.42+35);

 ctx.restore();
}

function draw(){
 drawBackground();
 drawShockwaves();
 drawSouls();
 drawSpellBalls();
 drawBullets();
 drawEnemies();
 drawBoss();
 drawParticles();

 if(running)drawPlayer();

 drawStageMessage();

 if(paused){
  ctx.fillStyle="#0009";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle="white";
  ctx.textAlign="center";
  ctx.font="bold 30px sans-serif";
  ctx.fillText("PAUSE",W/2,H/2);
 }
}

// ===================================
// メインループ
// ===================================

let lastTime=0;
let accumulator=0;

function loop(time){
 if(!lastTime)lastTime=time;

 const delta=Math.min((time-lastTime)/16.67,2);
 lastTime=time;

 if(running&&!paused){
  accumulator+=delta;

  while(accumulator>=1){
   update();
   accumulator--;
  }
 }

 draw();
 requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
showTitle();

</script>
</body>
</html>
