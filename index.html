
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>幻想紅月夜 Ver.3.3</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080817;color:white;font-family:sans-serif;overflow:hidden;touch-action:none}
canvas{width:100vw;height:100dvh;display:block;touch-action:none}
#hud{position:fixed;top:8px;left:10px;z-index:2;pointer-events:none;text-shadow:0 1px 5px black;font-size:13px;line-height:1.7}
#bossbar{position:fixed;top:115px;left:8%;width:84%;height:10px;background:#333;border:1px solid #aaa;display:none;z-index:2}
#bossfill{height:100%;width:100%;background:#55caff}
#spell{position:fixed;top:34%;left:0;width:100%;text-align:center;color:#c5f2ff;font-size:28px;font-weight:bold;text-shadow:0 0 15px #27aaff,0 0 30px #168bdc;z-index:4;pointer-events:none;display:none}
#overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:linear-gradient(#080817ed,#18102aee);padding:18px;overflow:auto}
h1{font-size:clamp(30px,8vw,48px);color:#b8eaff;text-shadow:0 0 20px #168bdc}
h2{color:#d4f3ff}
p{line-height:1.6}
button{background:#174c78;color:white;border:1px solid #8bdcff;border-radius:10px;padding:12px 20px;font-size:16px;margin:5px;min-width:120px;cursor:pointer}
button:active{background:#287db8}
button.selected{background:#2586bd;border:2px solid white}
#choices,#difficulties{display:flex;flex-wrap:wrap;justify-content:center}
#stick{position:fixed;left:22px;bottom:28px;width:116px;height:116px;border:2px solid #ffffff66;border-radius:50%;background:#ffffff15;z-index:3;touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:42px;height:42px;border-radius:50%;background:#c8eaffbb;border:2px solid white}
#dash{position:fixed;right:28px;bottom:125px;width:70px;height:54px;min-width:0;padding:5px;background:#167c9ddd;z-index:3}
#bomb{position:fixed;right:22px;bottom:35px;width:78px;height:70px;min-width:0;padding:5px;border-radius:15px;background:#245e9cdd;border:2px solid white;z-index:3}
#spellButton{position:fixed;right:112px;bottom:35px;width:88px;height:70px;min-width:0;padding:5px;border-radius:15px;background:#7542aadd;border:2px solid #d9c4ff;z-index:3}
.small{font-size:12px;color:#cbd9eb}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="hud">
 <div>幻想紅月夜 Ver.3.3</div>
 <div>PLAYER : ディフェンダー</div>
 <div id="score">SCORE : 0</div>
 <div id="life">LIFE : 3</div>
 <div id="bombs">BOMB : 3</div>
 <div id="spellCount">SPELL : 3</div>
 <div id="stage">STAGE : 1</div>
</div>

<div id="bossbar"><div id="bossfill"></div></div>
<div id="spell"></div>
<canvas id="game"></canvas>

<div id="stick"><div id="knob"></div></div>
<button id="dash">DASH<br><small>X</small></button>
<button id="spellButton">SPELL<br><small>Z / 3</small></button>
<button id="bomb">BOMB<br><small id="bombCount">3</small></button>

<div id="overlay">
 <h1>幻想紅月夜</h1>
 <h2>紅月弾幕録 Ver.3.3</h2>
 <p>氷の守護者、出撃。</p>

 <div id="menu">
  <button id="newGame">GAME START</button>
  <button id="instructions">HOW TO PLAY</button>
  <p id="highscore" class="small"></p>
 </div>

 <div id="select" class="hidden">
  <h2>自機選択</h2>
  <div id="choices">
   <button class="selected">❄ ディフェンダー</button>
  </div>
  <p>落ち着いた性格。氷を扱う守護者。</p>
  <p class="small">セリフ：後日設定予定</p>
  <h2>難易度</h2>
  <div id="difficulties">
   <button class="selected" data-diff="0">EASY</button>
   <button data-diff="1">NORMAL</button>
   <button data-diff="2">HARD</button>
  </div>
  <button id="begin">出撃する！</button>
  <button id="back">戻る</button>
 </div>

 <div id="help" class="hidden">
  <h2>操作方法</h2>
  <p>WASD・矢印：移動</p>
  <p>SHIFT：低速移動</p>
  <p>X：ダッシュ</p>
  <p>C：ボム</p>
  <p>Z：スペルカード「本能解放」</p>
  <p>スペルカード：敵弾を10秒間無効化し、電気の球を3発発射</p>
  <p>ESC：ポーズ</p>
  <p>iPad：左下の操作盤と右下のボタン</p>
  <button id="helpBack">戻る</button>
 </div>

 <div id="pauseMenu" class="hidden">
  <h2>PAUSE</h2>
  <button id="resume">ゲームに戻る</button>
  <button id="quit">タイトルに戻る</button>
 </div>

 <div id="result" class="hidden">
  <h2 id="resultTitle">GAME OVER</h2>
  <p id="resultText"></p>
  <button id="retry">もう一度遊ぶ</button>
  <button id="titleButton">タイトルへ</button>
 </div>
</div>

<script>
"use strict";

// ===================================
// 画面とキャンバス
// ===================================

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth,H=innerHeight;
let DPR=1;

function resize(){
 W=innerWidth;
 H=innerHeight;
 DPR=Math.min(devicePixelRatio||1,2);
 canvas.width=W*DPR;
 canvas.height=H*DPR;
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);
resize();

// ===================================
// 自機画像
// defender_new.png を使用
// ===================================

const defenderImage=new Image();
defenderImage.src="defender_new.png";

let spriteCanvas=document.createElement("canvas");
let spriteReady=false;

defenderImage.onload=function(){
 const sw=defenderImage.width;
 const sh=defenderImage.height;

 if(sw<=0||sh<=0)return;

 spriteCanvas.width=sw;
 spriteCanvas.height=sh;

 const sctx=spriteCanvas.getContext("2d");
 sctx.clearRect(0,0,sw,sh);
 sctx.drawImage(defenderImage,0,0);

 spriteReady=true;
};

defenderImage.onerror=function(){
 console.log("defender_new.pngを読み込めませんでした。");
};

// ===================================
// UI
// ===================================

const overlay=document.getElementById("overlay");
const menu=document.getElementById("menu");
const select=document.getElementById("select");
const help=document.getElementById("help");
const pauseMenu=document.getElementById("pauseMenu");
const result=document.getElementById("result");

const bossbar=document.getElementById("bossbar");
const bossfill=document.getElementById("bossfill");
const spell=document.getElementById("spell");

function showPanel(panel){
 menu.classList.add("hidden");
 select.classList.add("hidden");
 help.classList.add("hidden");
 pauseMenu.classList.add("hidden");
 result.classList.add("hidden");
 panel.classList.remove("hidden");
 overlay.classList.remove("hidden");
}

function showTitle(){
 showPanel(menu);
 overlay.classList.remove("hidden");
 document.querySelector("#menu h2").textContent="紅月弾幕録 Ver.3.3";
 document.querySelector("#menu p").textContent="氷の守護者、出撃。";
 document.getElementById("newGame").textContent="GAME START";
}

let difficulty=0;
let highscore=Number(localStorage.getItem("defenderHighscore")||0);
document.getElementById("highscore").textContent="HIGH SCORE : "+highscore;

document.getElementById("newGame").addEventListener("click",function(){
 showPanel(select);
});

document.getElementById("instructions").addEventListener("click",function(){
 showPanel(help);
});

document.getElementById("helpBack").addEventListener("click",showTitle);
document.getElementById("back").addEventListener("click",showTitle);

document.querySelectorAll("[data-diff]").forEach(function(button){
 button.addEventListener("click",function(){
  difficulty=Number(button.dataset.diff);
  document.querySelectorAll("[data-diff]").forEach(function(b){
   b.classList.remove("selected");
  });
  button.classList.add("selected");
 });
});

// ===================================
// ゲームデータ
// ===================================

let running=false;
let paused=false;
let frame=0;
let score=0;
let stage=1;
let lives=3;
let bombs=3;
let spellCards=3;

let enemies=[];
let bullets=[];
let enemyBullets=[];
let electricOrbs=[];
let particles=[];

let boss=null;
let spawnTimer=0;
let stageMessage=0;
let accumulator=0;
let spellMessageTimer=0;

const player={
 x:0,y:0,
 vx:0,vy:0,
 lastX:0,lastY:-1,
 speed:3.6,
 radius:4,
 invincible:0,
 spellInvincible:0,
 dashCooldown:0,
 dashTime:0,
 shotTimer:0
};

const keys={};
let joy={x:0,y:0};
let joyActive=false;

// ===================================
// キーボード
// ===================================

addEventListener("keydown",function(e){
 const k=e.key.toLowerCase();

 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)){
  e.preventDefault();
 }

 if(!keys[k]){
  if(k==="x")useDash();
  if(k==="c")useBomb();
  if(k==="z")useSpell();
  if(k==="escape")togglePause();
 }

 keys[k]=true;
});

addEventListener("keyup",function(e){
 keys[e.key.toLowerCase()]=false;
});

// ===================================
// タッチ操作
// ===================================

const stick=document.getElementById("stick");
const knob=document.getElementById("knob");

function updateJoy(e){
 const r=stick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 const max=39;
 const len=Math.hypot(dx,dy);

 if(len>max){
  dx=dx/len*max;
  dy=dy/len*max;
 }

 joy.x=dx/max;
 joy.y=dy/max;
 knob.style.left=(35+dx)+"px";
 knob.style.top=(35+dy)+"px";
}

stick.addEventListener("pointerdown",function(e){
 joyActive=true;
 stick.setPointerCapture(e.pointerId);
 updateJoy(e);
});

stick.addEventListener("pointermove",function(e){
 if(joyActive)updateJoy(e);
});

function stopJoy(){
 joyActive=false;
 joy={x:0,y:0};
 knob.style.left="35px";
 knob.style.top="35px";
}

stick.addEventListener("pointerup",stopJoy);
stick.addEventListener("pointercancel",stopJoy);

document.getElementById("dash").addEventListener("pointerdown",function(e){
 e.preventDefault();
 useDash();
});

document.getElementById("bomb").addEventListener("pointerdown",function(e){
 e.preventDefault();
 useBomb();
});

document.getElementById("spellButton").addEventListener("pointerdown",function(e){
 e.preventDefault();
 useSpell();
});

function getInput(){
 let x=joy.x;
 let y=joy.y;

 if(keys["arrowleft"]||keys["a"])x-=1;
 if(keys["arrowright"]||keys["d"])x+=1;
 if(keys["arrowup"]||keys["w"])y-=1;
 if(keys["arrowdown"]||keys["s"])y+=1;

 const len=Math.hypot(x,y);
 if(len>1){x/=len;y/=len;}

 return {x:x,y:y};
}

// ===================================
// ゲーム開始
// ===================================

document.getElementById("begin").addEventListener("click",startGame);

function startGame(){
 enemies=[];
 bullets=[];
 enemyBullets=[];
 electricOrbs=[];
 particles=[];
 boss=null;

 score=0;
 stage=1;
 lives=3;
 bombs=3;
 spellCards=3;
 frame=0;
 spawnTimer=0;
 stageMessage=160;
 spellMessageTimer=0;
 paused=false;
 running=true;

 player.x=W/2;
 player.y=H*.78;
 player.lastX=0;
 player.lastY=-1;
 player.vx=0;
 player.vy=0;
 player.invincible=120;
 player.spellInvincible=0;
 player.dashCooldown=0;
 player.dashTime=0;
 player.shotTimer=0;

 bossbar.style.display="none";
 spell.style.display="none";

 overlay.classList.add("hidden");
 updateHUD();
}

// ===================================
// ダッシュ
// ===================================

function useDash(){
 if(!running||paused||player.dashCooldown>0)return;

 let dx=player.lastX;
 let dy=player.lastY;

 if(Math.hypot(dx,dy)<.1)dy=-1;

 const len=Math.hypot(dx,dy);
 dx/=len;
 dy/=len;

 player.vx=dx*13;
 player.vy=dy*13;
 player.dashTime=13;
 player.dashCooldown=100;
 player.invincible=Math.max(player.invincible,25);

 for(let i=0;i<15;i++){
  particles.push({
   x:player.x,y:player.y,
   vx:(Math.random()-.5)*4,
   vy:(Math.random()-.5)*4,
   life:25,color:"#8eeaff"
  });
 }
}

// ===================================
// ボム
// ===================================

function useBomb(){
 if(!running||paused||bombs<=0)return;

 bombs--;
 enemyBullets=[];

 enemies.forEach(function(e){
  e.hp-=5;
 });

 if(boss)boss.hp-=35;

 for(let i=0;i<70;i++){
  const a=Math.random()*Math.PI*2;
  const s=Math.random()*8+2;
  particles.push({
   x:player.x,y:player.y,
   vx:Math.cos(a)*s,
   vy:Math.sin(a)*s,
   life:35,color:"#a9eaff"
  });
 }

 updateHUD();
}

// ===================================
// スペルカード「本能解放」
// ===================================

function useSpell(){
 if(!running||paused||spellCards<=0)return;

 spellCards--;

 // 敵弾によるダメージを10秒間無効化
 player.spellInvincible=600;

 // 発動メッセージ
 spell.textContent="本能解放";
 spell.style.display="block";
 spellMessageTimer=150;

 // 電気の球を3発同時発射
 const angles=[-0.18,0,0.18];

 for(let i=0;i<3;i++){
  electricOrbs.push({
   x:player.x,
   y:player.y-30,
   vx:Math.sin(angles[i])*2.2,
   vy:-8.5,
   radius:15,
   damage:25,
   life:180,
   dead:false
  });
 }

 // 発動時の光
 for(let i=0;i<35;i++){
  const a=Math.random()*Math.PI*2;
  const s=Math.random()*6+2;

  particles.push({
   x:player.x,
   y:player.y,
   vx:Math.cos(a)*s,
   vy:Math.sin(a)*s,
   life:35,
   color:"#b7a0ff"
  });
 }

 updateHUD();
}

// ===================================
// ショットと敵弾
// ===================================

function shoot(){
 bullets.push({
  x:player.x-12,y:player.y-20,
  vx:0,vy:-10,r:5,damage:1
 });
 bullets.push({
  x:player.x+12,y:player.y-20,
  vx:0,vy:-10,r:5,damage:1
 });
}

function spawnEnemy(){
 const x=30+Math.random()*(W-60);
 enemies.push({
  x:x,y:-25,hp:3,
  vx:(Math.random()-.5)*1.5,
  vy:1.2+Math.random(),
  timer:0
 });
}

function spawnEnemyBullet(x,y,vx,vy,color="#ff6688",r=5){
 enemyBullets.push({x:x,y:y,vx:vx,vy:vy,r:r,color:color});
}

function aimedBullet(x,y,speed,offset=0){
 const a=Math.atan2(player.y-y,player.x-x)+offset;
 spawnEnemyBullet(x,y,Math.cos(a)*speed,Math.sin(a)*speed);
}

function circlePattern(x,y,count,speed,offset,color){
 for(let i=0;i<count;i++){
  const a=(Math.PI*2/count)*i+offset;
  spawnEnemyBullet(
   x,y,Math.cos(a)*speed,Math.sin(a)*speed,color||"#72dfff",5
  );
 }
}

// ===================================
// ボス
// ===================================

function createBoss(){
 boss={
  x:W/2,y:105,
  hp:stage===1?180:260,
  maxHp:stage===1?180:260,
  timer:0
 };

 bossbar.style.display="block";
 spell.style.display="block";
 spell.textContent=stage===1?
  "氷符「凍てつく守護壁」":
  "絶対零度「蒼氷の世界」";
}

function bossAttack(){
 if(!boss)return;

 const t=boss.timer;
 const speed=difficulty===0?1.7:difficulty===1?2.3:2.9;

 if(stage===1){
  if(t%65===0){
   circlePattern(boss.x,boss.y+20,14,speed,t*.025,"#72dfff");
  }
  if(t%32===0){
   aimedBullet(boss.x,boss.y+20,speed+1);
  }
 }else{
  if(t%45===0){
   circlePattern(boss.x,boss.y+20,20,speed,t*.04,"#7aafff");
  }
  if(t%22===0){
   aimedBullet(boss.x-25,boss.y+15,speed+1,-.16);
   aimedBullet(boss.x+25,boss.y+15,speed+1,.16);
  }
 }
}

// ===================================
// ステージ進行
// ===================================

function nextStage(){
 stage++;

 boss=null;
 enemies=[];
 enemyBullets=[];
 bullets=[];
 electricOrbs=[];

 bossbar.style.display="none";
 spell.style.display="none";

 player.invincible=150;
 player.x=W/2;
 player.y=H*.78;

 frame=0;
 spawnTimer=0;
 stageMessage=180;

 if(stage>2){
  clearGame();
 }
}

function clearGame(){
 running=false;
 bossbar.style.display="none";
 spell.style.display="none";

 if(score>highscore){
  highscore=score;
  localStorage.setItem("defenderHighscore",String(highscore));
 }

 document.getElementById("highscore").textContent="HIGH SCORE : "+highscore;
 document.getElementById("resultTitle").textContent="ALL STAGE CLEAR!";
 document.getElementById("resultText").textContent="SCORE : "+score;

 showPanel(result);
}

// ===================================
// 衝突判定
// ===================================

function hit(a,b,r){
 return Math.hypot(a.x-b.x,a.y-b.y)<r;
}

function damagePlayer(){
 if(player.invincible>0||player.spellInvincible>0)return;

 lives--;
 player.invincible=110;
 updateHUD();

 if(lives<=0)endGame();
}

// ===================================
// ゲーム終了
// ===================================

function endGame(){
 running=false;
 bossbar.style.display="none";
 spell.style.display="none";

 if(score>highscore){
  highscore=score;
  localStorage.setItem("defenderHighscore",String(highscore));
 }

 document.getElementById("highscore").textContent="HIGH SCORE : "+highscore;
 document.getElementById("resultTitle").textContent="GAME OVER";
 document.getElementById("resultText").textContent="SCORE : "+score;

 showPanel(result);
}

document.getElementById("retry").addEventListener("click",startGame);

document.getElementById("titleButton").addEventListener("click",function(){
 running=false;
 paused=false;
 showTitle();
});

// ===================================
// ポーズ
// ===================================

function togglePause(){
 if(!running)return;

 paused=!paused;

 if(paused){
  showPanel(pauseMenu);
 }else{
  overlay.classList.add("hidden");
 }
}

document.getElementById("resume").addEventListener("click",function(){
 paused=false;
 overlay.classList.add("hidden");
});

document.getElementById("quit").addEventListener("click",function(){
 running=false;
 paused=false;
 showTitle();
});

// ===================================
// HUD
// ===================================

function updateHUD(){
 document.getElementById("score").textContent="SCORE : "+score;
 document.getElementById("life").textContent="LIFE : "+lives;
 document.getElementById("bombs").textContent="BOMB : "+bombs;
 document.getElementById("bombCount").textContent=bombs;
 document.getElementById("spellCount").textContent="SPELL : "+spellCards;
 document.getElementById("spellButton").innerHTML="SPELL<br><small>Z / "+spellCards+"</small>";
 document.getElementById("stage").textContent="STAGE : "+stage;
}

// ===================================
// 更新処理
// ===================================

function update(){
 if(!running||paused)return;

 frame++;

 const input=getInput();
 const slow=keys["shift"];
 const speed=slow?1.8:player.speed;

 if(player.dashTime>0){
  player.x+=player.vx;
  player.y+=player.vy;
  player.dashTime--;
  player.vx*=.88;
  player.vy*=.88;
 }else{
  player.x+=input.x*speed;
  player.y+=input.y*speed;

  if(input.x||input.y){
   player.lastX=input.x;
   player.lastY=input.y;
  }
 }

 // 自機画像の大きさを考慮して画面内に制限
 const playerHalfW=24;
 const playerHalfH=44;

 player.x=Math.max(playerHalfW,Math.min(W-playerHalfW,player.x));
 player.y=Math.max(playerHalfH,Math.min(H-playerHalfH,player.y));

 if(player.invincible>0)player.invincible--;
 if(player.spellInvincible>0)player.spellInvincible--;
 if(player.dashCooldown>0)player.dashCooldown--;

 if(spellMessageTimer>0){
  spellMessageTimer--;
  if(spellMessageTimer===0){
   spell.style.display="none";
  }
 }

 player.shotTimer++;
 if(player.shotTimer%9===0)shoot();

 // 敵出現
 spawnTimer++;
 const spawnLimit=difficulty===0?70:difficulty===1?55:42;

 if(!boss&&spawnTimer>spawnLimit){
  spawnEnemy();
  spawnTimer=0;
 }

 // 敵の動き
 for(const e of enemies){
  e.x+=e.vx;
  e.y+=e.vy;
  e.timer++;

  if(e.timer%85===0){
   aimedBullet(e.x,e.y,2.3);
  }
 }

 // ボス登場
 if(frame>1250&&!boss){
  createBoss();
 }

 // ボス攻撃
 if(boss){
  boss.timer++;
  boss.x=W/2+Math.sin(boss.timer*.012)*W*.27;
  bossAttack();

  bossfill.style.width=Math.max(0,boss.hp/boss.maxHp*100)+"%";

  if(boss.hp<=0){
   score+=stage===1?5000:10000;

   for(let i=0;i<50;i++){
    particles.push({
     x:boss.x,y:boss.y,
     vx:(Math.random()-.5)*8,
     vy:(Math.random()-.5)*8,
     life:40,color:"#8ceaff"
    });
   }

   nextStage();
  }
 }

 // 通常ショット
 for(const b of bullets){
  b.x+=b.vx;
  b.y+=b.vy;

  for(const e of enemies){
   if(!b.dead&&hit(b,e,17)){
    e.hp-=b.damage;
    b.dead=true;
    score+=10;
    break;
   }
  }

  if(!b.dead&&boss&&hit(b,boss,45)){
   boss.hp-=b.damage;
   b.dead=true;
  }
 }

 bullets=bullets.filter(b=>!b.dead&&b.y>-20);

 // 電気の球
 for(const orb of electricOrbs){
  orb.x+=orb.vx;
  orb.y+=orb.vy;
  orb.life--;

  // 敵に当たるとダメージ
  for(const e of enemies){
   if(!orb.dead&&hit(orb,e,orb.radius+14)){
    e.hp-=orb.damage;
    orb.dead=true;
    score+=100;
   }
  }

  // ボスに当たると大ダメージ
  if(!orb.dead&&boss&&hit(orb,boss,orb.radius+37)){
   boss.hp-=orb.damage;
   orb.dead=true;
   score+=50;
  }

  if(orb.life<=0||orb.y<-40)orb.dead=true;
 }

 electricOrbs=electricOrbs.filter(orb=>!orb.dead);

 // 敵弾
 for(const b of enemyBullets){
  b.x+=b.vx;
  b.y+=b.vy;

  if(
   hit(b,player,b.r+player.radius)&&
   player.invincible<=0&&
   player.spellInvincible<=0
  ){
   damagePlayer();
   b.dead=true;
  }
 }

 enemyBullets=enemyBullets.filter(function(b){
  return !b.dead&&b.x>-30&&b.x<W+30&&b.y>-30&&b.y<H+30;
 });

 // 敵との接触
 for(const e of enemies){
  if(hit(e,player,17)&&player.invincible<=0){
   damagePlayer();
  }
 }

 if(boss&&hit(boss,player,42)&&player.invincible<=0){
  damagePlayer();
 }

 // 敵撃破
 for(const e of enemies){
  if(e.hp<=0)score+=100;
 }

 enemies=enemies.filter(e=>e.hp>0&&e.y<H+50);

 // パーティクル
 for(const p of particles){
  p.x+=p.vx;
  p.y+=p.vy;
  p.vx*=.96;
  p.vy*=.96;
  p.life--;
 }

 particles=particles.filter(p=>p.life>0);

 if(stageMessage>0)stageMessage--;

 updateHUD();
}

// ===================================
// 背景描画
// ===================================

function drawBackground(){
 ctx.fillStyle="#080817";
 ctx.fillRect(0,0,W,H);

 for(let i=0;i<65;i++){
  const x=(i*137)%W;
  const y=(i*89+frame*.7)%H;
  ctx.fillStyle=i%3===0?"#7caedb":"#ffffff55";
  ctx.fillRect(x,y,2,2);
 }

 ctx.beginPath();
 ctx.arc(W*.78,H*.18,35,0,Math.PI*2);
 ctx.fillStyle="#a9dfff22";
 ctx.fill();

 ctx.beginPath();
 ctx.arc(W*.78,H*.18,25,0,Math.PI*2);
 ctx.fillStyle="#bdeaff22";
 ctx.fill();
}

// ===================================
// 自機描画
// ===================================

function drawPlayer(){
 ctx.save();

 if(player.invincible>0&&Math.floor(frame/5)%2===0){
  ctx.globalAlpha=.4;
 }

 if(player.spellInvincible>0){
  ctx.shadowColor="#a77bff";
  ctx.shadowBlur=18;
 }

 if(spriteReady){
  const sw=spriteCanvas.width;
  const sh=spriteCanvas.height;

  const maxWidth=48;
  const maxHeight=88;
  const scale=Math.min(maxWidth/sw,maxHeight/sh);

  const drawW=sw*scale;
  const drawH=sh*scale;

  ctx.drawImage(
   spriteCanvas,
   0,0,sw,sh,
   player.x-drawW/2,
   player.y-drawH/2,
   drawW,drawH
  );
 }else{
  ctx.fillStyle="#222";
  ctx.fillRect(player.x-12,player.y-18,24,36);
  ctx.fillStyle="#59d9ff";
  ctx.fillRect(player.x-7,player.y-12,14,24);
 }

 ctx.restore();

 // 当たり判定の目印
 ctx.beginPath();
 ctx.arc(player.x,player.y,player.radius,0,Math.PI*2);
 ctx.fillStyle="#ffffff";
 ctx.fill();

 if(keys["shift"]){
  ctx.beginPath();
  ctx.arc(player.x,player.y,10,0,Math.PI*2);
  ctx.strokeStyle="#b7efff";
  ctx.stroke();
 }

 // スペルカード中の保護リング
 if(player.spellInvincible>0){
  ctx.save();
  ctx.beginPath();
  ctx.arc(player.x,player.y,30+Math.sin(frame*.15)*3,0,Math.PI*2);
  ctx.strokeStyle="#b58aff";
  ctx.lineWidth=3;
  ctx.shadowColor="#a77bff";
  ctx.shadowBlur=15;
  ctx.stroke();
  ctx.restore();
 }
}

// ===================================
// 電気の球の描画
// ===================================

function drawElectricOrbs(){
 for(const orb of electricOrbs){
  ctx.save();

  // 外側の電気の光
  ctx.shadowColor="#62dfff";
  ctx.shadowBlur=25;

  const gradient=ctx.createRadialGradient(
   orb.x-4,orb.y-5,2,
   orb.x,orb.y,orb.radius
  );

  gradient.addColorStop(0,"#ffffff");
  gradient.addColorStop(.35,"#b9f5ff");
  gradient.addColorStop(.7,"#48bfff");
  gradient.addColorStop(1,"#2455d9");

  ctx.fillStyle=gradient;
  ctx.beginPath();
  ctx.arc(orb.x,orb.y,orb.radius,0,Math.PI*2);
  ctx.fill();

  // 電気のギザギザ
  ctx.shadowColor="#a9f5ff";
  ctx.shadowBlur=15;
  ctx.strokeStyle="#e6ffff";
  ctx.lineWidth=2.5;

  for(let j=0;j<3;j++){
   const a=frame*.12+j*2.1;
   const x1=orb.x+Math.cos(a)*orb.radius*.7;
   const y1=orb.y+Math.sin(a)*orb.radius*.7;
   const x2=orb.x+Math.cos(a+.7)*orb.radius*1.5;
   const y2=orb.y+Math.sin(a+.7)*orb.radius*1.5;

   ctx.beginPath();
   ctx.moveTo(x1,y1);
   ctx.lineTo(x2,y2);
   ctx.lineTo(
    x2+Math.cos(a+1.4)*5,
    y2+Math.sin(a+1.4)*5
   );
   ctx.stroke();
  }

  ctx.restore();
 }
}

// ===================================
// 弾描画
// ===================================

function drawBullets(){
 for(const b of bullets){
  ctx.fillStyle="#a8eeff";
  ctx.beginPath();
  ctx.ellipse(b.x,b.y,4,9,0,0,Math.PI*2);
  ctx.fill();
 }

 for(const b of enemyBullets){
  ctx.fillStyle=b.color;
  ctx.beginPath();
  ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle="#ffffff66";
  ctx.stroke();
 }
}

function drawEnemies(){
 for(const e of enemies){
  ctx.fillStyle="#a94b76";
  ctx.beginPath();
  ctx.arc(e.x,e.y,14,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#ffd5e5";
  ctx.fillRect(e.x-5,e.y-3,10,5);
 }
}

function drawBoss(){
 if(!boss)return;

 ctx.save();
 ctx.fillStyle="#173d63";
 ctx.strokeStyle="#8eeaff";
 ctx.lineWidth=3;

 ctx.beginPath();
 ctx.arc(boss.x,boss.y,37,0,Math.PI*2);
 ctx.fill();
 ctx.stroke();

 ctx.fillStyle="#d9f7ff";
 ctx.beginPath();
 ctx.arc(boss.x,boss.y,12,0,Math.PI*2);
 ctx.fill();

 ctx.restore();
}

function drawParticles(){
 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life/40);
  ctx.fillStyle=p.color;
  ctx.beginPath();
  ctx.arc(p.x,p.y,3,0,Math.PI*2);
  ctx.fill();
 }
 ctx.globalAlpha=1;
}

function drawStageMessage(){
 if(stageMessage<=0)return;

 ctx.save();
 ctx.textAlign="center";
 ctx.fillStyle="#d4f3ff";
 ctx.font="bold 28px sans-serif";
 ctx.shadowColor="#168bdc";
 ctx.shadowBlur=15;

 ctx.fillText("STAGE "+stage,W/2,H*.42);

 ctx.font="16px sans-serif";
 ctx.fillText(
  stage===1?"氷の守護者":"蒼氷の世界",
  W/2,H*.42+35
 );

 ctx.restore();
}

function draw(){
 drawBackground();
 drawBullets();
 drawElectricOrbs();
 drawEnemies();
 drawBoss();
 drawParticles();

 if(running)drawPlayer();

 drawStageMessage();

 if(paused){
  ctx.fillStyle="#0009";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle="white";
  ctx.textAlign="center";
  ctx.font="bold 30px sans-serif";
  ctx.fillText("PAUSE",W/2,H/2);
 }
}

// ===================================
// メインループ
// ===================================

let lastTime=0;

function loop(time){
 if(!lastTime)lastTime=time;

 const delta=Math.min((time-lastTime)/16.67,2);
 lastTime=time;

 if(running&&!paused){
  accumulator+=delta;

  while(accumulator>=1){
   update();
   accumulator--;
  }
 }

 draw();
 requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
showTitle();

</script>
</body>
</html>
